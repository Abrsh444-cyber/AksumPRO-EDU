name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger of the build

jobs:
  build:
    name: Compile & Build Android App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js Environment
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Setup Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 4: Install Dependencies & Build Web Assets
      - name: Install NPM Dependencies & Build Web App
        run: |
          npm install
          npm run build

      # Step 5: Install and Setup Capacitor
      - name: Install Capacitor CLI and Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # Step 6: Remove existing android folder and recreate it
      - name: Setup Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      # Step 7: Make Gradlew executable and Compile the Android .APK file
      - name: Compile Android APK (Debug Mode)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      # Step 8: Upload the finished installation APK as a GitHub Action Artifact
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aksum-vip-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
