<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aksum VIP Prep Academy - National Matric Prep</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#cca43b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aksum VIP" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/000000/graduation-cap.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Aksum VIP ServiceWorker registered successfully!', reg.scope))
            .catch(err => console.error('Aksum VIP ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
